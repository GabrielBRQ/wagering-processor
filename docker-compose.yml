services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.8
    container_name: wagering-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  sqs-init:
    image: amazon/aws-cli:2.17.0
    container_name: wagering-sqs-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name wager-transactions-dlq.fifo \
          --attributes FifoQueue=true,ContentBasedDeduplication=false
        DLQ_ARN=$$(aws --endpoint-url=http://localstack:4566 sqs get-queue-attributes \
          --queue-url http://localstack:4566/000000000000/wager-transactions-dlq.fifo \
          --attribute-names QueueArn --query 'Attributes.QueueArn' --output text)
        aws --endpoint-url=http://localstack:4566 sqs create-queue \
          --queue-name wager-transactions.fifo \
          --attributes "{\"FifoQueue\":\"true\",\"ContentBasedDeduplication\":\"false\",\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"$$DLQ_ARN\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}"
        echo "SQS FIFO queues initialized."

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wagering
      DB_PASSWORD: wagering
      DB_NAME: wagering_db
    command: ["bun", "run", "dist/infrastructure/database/migrate.js"]

  app-1: &app-service
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-app-1
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      sqs-init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wagering
      DB_PASSWORD: wagering
      DB_NAME: wagering_db
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-2:
    <<: *app-service
    container_name: wagering-app-2

  app-3:
    <<: *app-service
    container_name: wagering-app-3

  nginx:
    image: nginx:1.27-alpine
    container_name: wagering-nginx
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data: